services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeroops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeroops}
      POSTGRES_DB: ${POSTGRES_DB:-aeroops}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aeroops}:${POSTGRES_PASSWORD:-aeroops}@postgres:5432/${POSTGRES_DB:-aeroops}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [internal, external]

  simulator:
    build:
      context: ../simulator
    env_file:
      - ../simulator/.env
    environment:
      INGEST_URL: http://api:8000/telemetry
    depends_on:
      - api
    profiles: ["with-simulator"]
    networks: [internal]

  web:
    build:
      context: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    networks: [external]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [internal, external]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [external]

  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web
    profiles: ["with-proxy"]
    networks: [external]

networks:
  internal:
  external:

volumes:
  pgdata:
  grafana-data:
