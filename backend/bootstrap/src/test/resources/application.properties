# 시험 공통 설정.
#
# 스트림 구독을 기본으로 끄는 이유: 구독은 Redis를 요구하는데, 대부분의 시험(마이그레이션·저장소·보안·
# 관측성)은 DB만 필요하다. 모든 시험에 Redis 컨테이너를 강제하면 느려지고 관심사도 흐려진다.
# 스트림 자체를 검증하는 시험만 @TestPropertySource로 다시 켠다(TelemetryStreamConsumerTest).
aeroops.telemetry.stream.enabled=false

# Redis 헬스 체크를 시험에서 끄는 이유: Redis 의존성이 클래스패스에 있으면 헬스 지표가 자동으로 켜져,
# Redis를 띄우지 않는 시험에서 전체 헬스가 DOWN이 된다. 운영에서는 Redis가 필수라 켜 둔다
# (스트림 소비가 멈추면 상황도가 갱신되지 않으므로 DOWN이 맞다).
management.health.redis.enabled=false
