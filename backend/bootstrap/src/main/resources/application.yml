spring:
  application:
    name: aeroops-c2-core

  # 접속 정보는 환경변수로 덮어쓴다(비밀번호를 코드에 두지 않기 위해). 기본값은 로컬 dev 스택
  # (infra/docker-compose.yml의 postgres, 호스트 포트 5433)과 같다.
  # 주의: 이 DB는 legacy FastAPI와 같은 DB다. 처음 접속하면 Flyway가 flyway_schema_history 테이블을 만들고
  # baseline(V1)으로 등록한다 — 기존 데이터는 건드리지 않는다(db/migration/V1 헤더, LegacySchemaGuard).
  datasource:
    url: ${C2_DB_URL:jdbc:postgresql://localhost:5433/aeroops}
    username: ${C2_DB_USER:aeroops}
    password: ${C2_DB_PASSWORD:aeroops}

  jpa:
    # 요청 처리가 끝난 뒤에도 영속성 컨텍스트가 열려 있으면 컨트롤러에서 지연 로딩이 새어 나가
    # 트랜잭션 경계가 흐려진다. 경계는 application 레이어가 정한다(planning/02 원칙).
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. 엔티티와 실제 스키마가 어긋나면 기동 시점에 실패시키려고 validate를 쓴다
      # (update/create는 JPA가 몰래 DDL을 바꿔 "단일 쓰기 주체" 원칙(ADR 0004)을 깬다).
      ddl-auto: validate

  # 이벤트 발행 기록(Outbox) 설정 — 표가 아니라 메커니즘에 대한 설정이다(V2 마이그레이션 참고).
  modulith:
    events:
      jdbc:
        # 스키마는 Flyway(V2)가 만든다. Modulith가 기동 때 자체적으로 DDL을 실행하면 DDL 주체가 둘이 되어
        # ADR 0004의 "스키마는 Flyway만 바꾼다" 원칙이 깨진다.
        schema-initialization:
          enabled: false
      # 완료된 발행 기록을 본 테이블에서 보관 테이블로 옮긴다(본 테이블이 계속 커지지 않게).
      completion-mode: archive

  flyway:
    locations: classpath:db/migration
    # 이미 Alembic 0005까지 적용된 기존 DB를 V1로 baseline 처리한다. 빈 DB는 V1을 실제로 실행한다.
    # 위험(엉뚱한 DB를 baseline 처리)은 LegacySchemaGuard가 막는다.
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: "legacy Alembic 0005 schema"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # prometheus: 메트릭 수집(infra/prometheus/prometheus.yml이 /actuator/prometheus를 긁는다)
        # 운영 노출 범위는 8단계 보안 검토에서 다시 정한다 — 지금은 내부망 전제(ADR 0006).
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # 배포 도구(Go opsctl Health Gate 등)가 구분해서 볼 수 있게 liveness/readiness를 분리한다.
      probes:
        enabled: true
  metrics:
    tags:
      # 전환 기간에는 legacy와 Kotlin이 같은 Prometheus로 수집된다. 이 태그로 어느 구현의 수치인지
      # 구분한다(대시보드에서 두 값을 겹쳐 보며 전환 전후를 비교하기 위함).
      application: ${spring.application.name}
  tracing:
    sampling:
      # 개발·전환 기간에는 전부 수집한다. 운영 트래픽에서는 낮춰야 한다(8단계).
      probability: 1.0

logging:
  pattern:
    # traceId·spanId를 로그에 넣어 한 요청의 처리 흐름을 추적한다. 수집기가 없어도 로그만으로 쓸 수 있다.
    correlation: "[${spring.application.name},%X{traceId:-},%X{spanId:-}] "
  # 구조화(JSON) 로그는 환경변수로 켠다 — 컨테이너·로그 수집기 환경에서는 ecs, 로컬 개발에서는 사람이
  # 읽기 좋은 기본 형식을 쓰기 위해서다(예: C2_LOG_FORMAT=ecs).
  structured:
    format:
      console: ${C2_LOG_FORMAT:}
